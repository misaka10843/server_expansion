plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.82'
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
}

tasks.named('wrapper', Wrapper).configure {
    // 在此定义 wrapper 值，避免每次更新 gradlew.properties 时都需要手动设置
    // 切换为 Wrapper.DistributionType.ALL 将下载完整的 gradle 源码，
    // 可在鼠标悬停时显示 gradle 类和方法的文档。但这会增加 Gradle 文件大小。
    // 如果切换为 ALL，之后需要运行两次 Gradle wrapper 任务。
    // （通过检查 gradle/wrapper/gradle-wrapper.properties 中的 distributionUrl 是否指向 `-all` 来验证）
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven {url = 'https://thedarkcolour.github.io/KotlinForForge/'}
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    mavenCentral()
}

base {
    archivesName = mod_id
}

// Mojang 从 1.20.5 开始向用户提供 Java 21，因此模组应以 Java 21 为目标版本
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // 指定要使用的 NeoForge 版本
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // 此行为可选项。Access Transformers 会自动检测
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // 默认运行配置
    // 可根据需要调整、删除或复制这些配置
    runs {
        client {
            client()

            // 用逗号分隔的命名空间列表，用于加载游戏测试。为空则加载所有命名空间
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // 此运行配置启动 GameTestServer 并运行所有已注册的游戏测试，然后退出
        // 默认情况下，如果没有提供游戏测试，服务器将崩溃
        // 游戏测试系统在其他运行配置中也默认启用，可通过 /test 命令使用
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // 覆盖上面 configureEach 中设置的工作目录的示例，如需使用请取消注释
            // gameDirectory = project.file('run-data')

            // 指定数据生成的模组ID、输出资源的位置以及查找现有资源的位置
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // 应用于上述所有运行配置
        configureEach {
            // 推荐的开发环境日志数据
            // 可根据需要添加/删除标记，用逗号分隔
            // "SCAN": 用于模组扫描
            // "REGISTRIES": 用于触发注册表事件
            // "REGISTRYDUMP": 用于获取所有注册表的内容
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // 推荐的控制台日志级别
            // 可在此设置不同的级别
            // 参考: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // 定义模组与源代码的绑定关系
        // 用于告诉游戏哪些源代码属于哪个模组
        // 多模组项目应为每个模组定义一个
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 包含数据生成器生成的资源
sourceSets.main.resources { srcDir 'src/generated/resources' }

// 设置名为 'localRuntime' 的依赖配置
// 应使用此配置而非 'runtimeOnly' 来声明运行时测试需要的依赖，
// 这些依赖是「可选的」，不会被依赖此模组的其他模组拉取
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "thedarkcolour:kotlinforforge-neoforge:${kotlinforforge_version}"
    // Server I18n API（可选依赖，编译时需要，运行时可选）
    compileOnly "maven.modrinth:server-i18n-api:1.5.1-1.21.3-neoforge"
    // implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    // JEI 可选模组依赖示例
    // JEI API 声明为编译时使用，完整的 JEI 构件在运行时使用
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // 将完整版本添加到 localRuntime 而非 runtimeOnly，这样不会发布对它的依赖
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // 使用 ./libs 目录中模组 jar 的依赖示例（flat dir 仓库）
    // 映射到 ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // 搜索时忽略 group id —— 在此例中为 "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // 使用文件作为依赖的示例
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // 使用兄弟或子项目作为依赖的示例
    // implementation project(":myproject")

    // 更多信息参考:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// 此代码块在指定的资源目标中展开所有声明的替换属性
// 缺少属性将导致错误。使用 ${} Groovy 表示法展开属性
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            loader_version_range   : loader_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// 将 "generateModMetadata" 的输出作为构建的输入目录
// 这适用于通过 Gradle 和 IDE 进行的构建
sourceSets.main.resources.srcDir generateModMetadata
// 为避免手动运行 "generateModMetadata"，使其在每次项目重新加载时运行
neoForge.ideSyncTask generateModMetadata

// 使用 maven-publish 插件发布的配置示例
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Java 编译使用 UTF-8 字符集
}

// IDEA 不再自动下载依赖的源码/javadoc jar，因此需要显式启用此行为
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
kotlin {
    jvmToolchain(21)
}
